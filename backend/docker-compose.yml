version: "3.8"

services:
  # ─── Redis (message broker + result backend) ──────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # ─── API (webhook receiver) ────────────────────────────────────────────
  api:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn backend.src.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  # ─── Worker (Celery) ───────────────────────────────────────────────────
  worker:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A backend.src.workers.celery_app worker --loglevel=info --concurrency=2
    restart: unless-stopped

  # ─── Flower (monitoramento Celery) ─────────────────────────────────────
  flower:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    ports:
      - "5555:5555"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A backend.src.workers.celery_app flower --port=5555
    restart: unless-stopped

volumes:
  redis_data:
