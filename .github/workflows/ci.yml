name: OdontoQuiz Pipeline CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Testes ──────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest tests/ \
            -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            -p no:warnings

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  # ─── Lint (opcional) ─────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ruff lint
        uses: chartboost/ruff-action@v1
        with:
          args: check backend/src/ --select E,W,F --ignore E501

  # ─── Deploy Railway (automatic push-to-deploy) ───────────────────────────
  # Railway conecta automaticamente ao repo GitHub.
  # O deploy dispara no push para main — nenhuma ação adicional necessária.
  #
  # Para deploy manual via CLI:
  # deploy:
  #   needs: test
  #   runs-on: ubuntu-latest
  #   if: github.ref == 'refs/heads/main'
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Deploy to Railway
  #       uses: railwayapp/cli-action@v1
  #       with:
  #         service: api
  #       env:
  #         RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ─── Migration check (dry-run) ───────────────────────────────────────────
  migration-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install alembic psycopg2-binary
      - name: Validate migrations (dry-run)
        run: |
          DATABASE_URL="postgresql://user:pass@localhost:5432/db" alembic upgrade head --sql > /dev/null
          echo "✅ Migrations SQL válido"
          DATABASE_URL="postgresql://user:pass@localhost:5432/db" alembic downgrade base --sql > /dev/null
          echo "✅ Downgrade SQL válido"
